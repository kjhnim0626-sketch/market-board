name: build-board

on:
  schedule:
    - cron: '30 21 * * 0-4'   # 평일 06:30 KST — 미국 마감 후
    - cron: '30 8 * * 1-5'    # 평일 17:30 KST — 한국·일본·홍콩 마감 후
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python market_board.py
      - run: mkdir _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
